<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#0d1117">
<title>404 — SENTINEL</title>
<meta name="description" content="Nothing is published at this address on sonde.briansheppard.com.">
<meta name="robots" content="noindex">
<style>
:root {
  --bg: #0d1117;
  --surface: #161b22;
  --border: #30363d;
  --text: #c9d1d9;
  --text-dim: #8b949e;
  --green: #3fb950;
  --amber: #d29922;
  --red: #f85149;
  --blue: #58a6ff;
  --purple: #a371f7;
  --green-bg: rgba(63,185,80,0.12);
  --amber-bg: rgba(210,153,34,0.12);
  --red-bg: rgba(248,81,73,0.12);
  --purple-bg: rgba(163,113,247,0.12);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}
.container { max-width: 1400px; margin: 0 auto; padding: 20px 16px; }

/* --- Header --- */
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 24px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
}
.logo {
  font-size: 24px;
  font-weight: 700;
  letter-spacing: 4px;
  color: var(--green);
}
.logo span { color: var(--text-dim); font-weight: 400; font-size: 14px; letter-spacing: 1px; margin-left: 12px; }
.meta { text-align: right; font-size: 12px; color: var(--text-dim); }
.meta .updated { color: var(--text); }
.refresh-dot {
  display: inline-block;
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--green);
  margin-right: 6px;
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}

/* --- Section headers --- */
.section-title {
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 2px;
  color: var(--text-dim);
  text-transform: uppercase;
  margin: 28px 0 12px;
}
.section-sub { font-size: 11px; color: var(--text-dim); margin: -8px 0 12px; letter-spacing: 0; text-transform: none; }

/* --- Banners --- */
.banner {
  padding: 10px 16px;
  border-radius: 6px;
  margin-bottom: 16px;
  font-size: 13px;
  display: none;
  border: 1px solid;
}
.banner.red { background: var(--red-bg); border-color: var(--red); color: var(--red); }
.banner.amber { background: var(--amber-bg); border-color: var(--amber); color: var(--amber); }

/* --- Region cards --- */
.region-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
  gap: 12px;
}
.region-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 16px;
  position: relative;
  overflow: hidden;
}
.region-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: var(--border);
}
.region-card.ok::before { background: var(--green); }
.region-card.warn::before { background: var(--amber); }
.region-card.down::before { background: var(--red); }
.region-card.err::before { background: var(--purple); }
.region-card.down { border-color: rgba(248,81,73,0.3); }

.region-name {
  font-size: 16px;
  font-weight: 600;
  margin-bottom: 2px;
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
}
.region-tag {
  font-size: 11px;
  color: var(--text-dim);
  margin-bottom: 12px;
}
.signal-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
  padding: 4px 0;
  border-top: 1px solid var(--border);
}
.signal-label { color: var(--text-dim); }
.signal-value { font-weight: 600; }
.signal-value.ok { color: var(--green); }
.signal-value.warn { color: var(--amber); }
.signal-value.down { color: var(--red); }
.signal-value.err { color: var(--purple); }
.signal-value.na { color: var(--text-dim); }
.pill {
  display: inline-block;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1px;
  padding: 2px 8px;
  border-radius: 4px;
}
.pill.down { background: var(--red-bg); color: var(--red); }
.pill.ok { background: var(--green-bg); color: var(--green); }
.pill.err { background: var(--purple-bg); color: var(--purple); }

/* --- Timeline --- */
.timeline-container {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 16px;
  overflow-x: auto;
}
.timeline-row {
  display: flex;
  align-items: center;
  margin-bottom: 6px;
}
.timeline-label {
  width: 120px;
  min-width: 120px;
  font-size: 11px;
  color: var(--text-dim);
  text-align: right;
  padding-right: 10px;
}
.timeline-bar {
  display: flex;
  flex: 1;
  height: 16px;
  gap: 1px;
  border-radius: 3px;
  overflow: hidden;
}
.timeline-cell {
  flex: 1;
  min-width: 2px;
  border-radius: 1px;
}
.timeline-cell.ok { background: var(--green); }
.timeline-cell.warn { background: var(--amber); }
.timeline-cell.down { background: var(--red); }
.timeline-cell.err { background: var(--purple); }
.timeline-cell.none { background: var(--border); }
.timeline-axis {
  display: flex;
  padding-left: 120px;
  margin-top: 4px;
}
.timeline-axis span {
  flex: 1;
  font-size: 10px;
  color: var(--text-dim);
  text-align: center;
}
.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  margin-top: 12px;
  padding-top: 10px;
  border-top: 1px solid var(--border);
  font-size: 11px;
  color: var(--text-dim);
}
.legend i {
  display: inline-block;
  width: 10px; height: 10px;
  border-radius: 2px;
  margin-right: 5px;
  vertical-align: -1px;
}
.legend i.ok { background: var(--green); }
.legend i.warn { background: var(--amber); }
.legend i.down { background: var(--red); }
.legend i.err { background: var(--purple); }
.legend i.none { background: var(--border); }

/* --- Tables --- */
.table-wrap {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow-x: auto;
}
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
}
th {
  text-align: left;
  padding: 10px 12px;
  background: rgba(88,166,255,0.06);
  color: var(--text-dim);
  font-weight: 600;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 1px;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
td {
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
tr:last-child td { border-bottom: none; }
.vis-bar {
  display: inline-block;
  height: 6px;
  border-radius: 3px;
  background: var(--green);
  min-width: 4px;
  vertical-align: middle;
  margin-right: 6px;
}
.delta { color: var(--text-dim); font-size: 11px; margin-left: 4px; }
.delta.warn { color: var(--amber); }
.delta.down { color: var(--red); }

/* --- Flight zones --- */
.flight-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 12px;
}
.flight-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px;
}
.flight-zone-name {
  font-size: 12px;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 4px;
  text-align: center;
}
.flight-count {
  font-size: 28px;
  font-weight: 700;
  color: var(--text);
  text-align: center;
}
.flight-label { font-size: 11px; color: var(--text-dim); text-align: center; margin-bottom: 8px; }
.flight-note { font-size: 11px; color: var(--text-dim); margin-bottom: 8px; text-align: center; }

/* --- Footer --- */
footer {
  margin-top: 32px;
  padding-top: 16px;
  border-top: 1px solid var(--border);
  font-size: 11px;
  color: var(--text-dim);
  text-align: center;
  line-height: 1.7;
}
footer a { color: var(--blue); text-decoration: none; }

.loading {
  text-align: center;
  padding: 60px;
  color: var(--text-dim);
  font-size: 14px;
}
</style>
</head>
<body>
<div class="container">
  <header>
    <div>
      <div class="logo"><a href="/" style="color:inherit;text-decoration:none">SENTINEL</a><span>Infrastructure Ground Truth</span></div>
    </div>
    <div class="meta">
      <div>HTTP 404</div>
    </div>
  </header>

  <div class="banner amber" style="display:block">Nothing at this address. If a link brought you here, it is out of date.</div>

  <div id="content">
    <div class="loading">The live dashboard is at <a href="/" style="color:var(--blue)">sonde.briansheppard.com</a>. Project source: <a href="https://github.com/the-ensemble/sentinel-heartbeat" style="color:var(--blue)">github.com/the-ensemble/sentinel-heartbeat</a>.</div>
  </div>
</div>
</body>
</html>
