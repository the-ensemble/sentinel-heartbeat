<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SENTINEL — Infrastructure Ground Truth</title>
<meta name="description" content="Independent, multi-signal ground-truth monitoring of internet and cloud infrastructure in conflict zones.">
<style>
:root {
  --bg: #0d1117;
  --surface: #161b22;
  --border: #30363d;
  --text: #c9d1d9;
  --text-dim: #8b949e;
  --green: #3fb950;
  --amber: #d29922;
  --red: #f85149;
  --blue: #58a6ff;
  --purple: #a371f7;
  --green-bg: rgba(63,185,80,0.12);
  --amber-bg: rgba(210,153,34,0.12);
  --red-bg: rgba(248,81,73,0.12);
  --purple-bg: rgba(163,113,247,0.12);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}
.container { max-width: 1400px; margin: 0 auto; padding: 20px 16px; }

/* --- Header --- */
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 24px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
}
.logo {
  font-size: 24px;
  font-weight: 700;
  letter-spacing: 4px;
  color: var(--green);
}
.logo span { color: var(--text-dim); font-weight: 400; font-size: 14px; letter-spacing: 1px; margin-left: 12px; }
.meta { text-align: right; font-size: 12px; color: var(--text-dim); }
.meta .updated { color: var(--text); }
.refresh-dot {
  display: inline-block;
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--green);
  margin-right: 6px;
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}

/* --- Section headers --- */
.section-title {
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 2px;
  color: var(--text-dim);
  text-transform: uppercase;
  margin: 28px 0 12px;
}
.section-sub { font-size: 11px; color: var(--text-dim); margin: -8px 0 12px; letter-spacing: 0; text-transform: none; }

/* --- Banners --- */
.banner {
  padding: 10px 16px;
  border-radius: 6px;
  margin-bottom: 16px;
  font-size: 13px;
  display: none;
  border: 1px solid;
}
.banner.red { background: var(--red-bg); border-color: var(--red); color: var(--red); }
.banner.amber { background: var(--amber-bg); border-color: var(--amber); color: var(--amber); }

/* --- Region cards --- */
.region-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
  gap: 12px;
}
.region-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 16px;
  position: relative;
  overflow: hidden;
}
.region-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: var(--border);
}
.region-card.ok::before { background: var(--green); }
.region-card.warn::before { background: var(--amber); }
.region-card.down::before { background: var(--red); }
.region-card.err::before { background: var(--purple); }
.region-card.down { border-color: rgba(248,81,73,0.3); }

.region-name {
  font-size: 16px;
  font-weight: 600;
  margin-bottom: 2px;
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
}
.region-tag {
  font-size: 11px;
  color: var(--text-dim);
  margin-bottom: 12px;
}
.signal-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
  padding: 4px 0;
  border-top: 1px solid var(--border);
}
.signal-label { color: var(--text-dim); }
.signal-value { font-weight: 600; }
.signal-value.ok { color: var(--green); }
.signal-value.warn { color: var(--amber); }
.signal-value.down { color: var(--red); }
.signal-value.err { color: var(--purple); }
.signal-value.na { color: var(--text-dim); }
.pill {
  display: inline-block;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1px;
  padding: 2px 8px;
  border-radius: 4px;
}
.pill.down { background: var(--red-bg); color: var(--red); }
.pill.ok { background: var(--green-bg); color: var(--green); }
.pill.err { background: var(--purple-bg); color: var(--purple); }

/* --- Timeline --- */
.timeline-container {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 16px;
  overflow-x: auto;
}
.timeline-row {
  display: flex;
  align-items: center;
  margin-bottom: 6px;
}
.timeline-label {
  width: 120px;
  min-width: 120px;
  font-size: 11px;
  color: var(--text-dim);
  text-align: right;
  padding-right: 10px;
}
.timeline-bar {
  display: flex;
  flex: 1;
  height: 16px;
  gap: 1px;
  border-radius: 3px;
  overflow: hidden;
}
.timeline-cell {
  flex: 1;
  min-width: 2px;
  border-radius: 1px;
}
.timeline-cell.ok { background: var(--green); }
.timeline-cell.warn { background: var(--amber); }
.timeline-cell.down { background: var(--red); }
.timeline-cell.err { background: var(--purple); }
.timeline-cell.none { background: var(--border); }
.timeline-axis {
  display: flex;
  padding-left: 120px;
  margin-top: 4px;
}
.timeline-axis span {
  flex: 1;
  font-size: 10px;
  color: var(--text-dim);
  text-align: center;
}
.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  margin-top: 12px;
  padding-top: 10px;
  border-top: 1px solid var(--border);
  font-size: 11px;
  color: var(--text-dim);
}
.legend i {
  display: inline-block;
  width: 10px; height: 10px;
  border-radius: 2px;
  margin-right: 5px;
  vertical-align: -1px;
}
.legend i.ok { background: var(--green); }
.legend i.warn { background: var(--amber); }
.legend i.down { background: var(--red); }
.legend i.err { background: var(--purple); }
.legend i.none { background: var(--border); }

/* --- Tables --- */
.table-wrap {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow-x: auto;
}
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
}
th {
  text-align: left;
  padding: 10px 12px;
  background: rgba(88,166,255,0.06);
  color: var(--text-dim);
  font-weight: 600;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 1px;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
td {
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
tr:last-child td { border-bottom: none; }
.vis-bar {
  display: inline-block;
  height: 6px;
  border-radius: 3px;
  background: var(--green);
  min-width: 4px;
  vertical-align: middle;
  margin-right: 6px;
}
.delta { color: var(--text-dim); font-size: 11px; margin-left: 4px; }
.delta.warn { color: var(--amber); }
.delta.down { color: var(--red); }

/* --- Flight zones --- */
.flight-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 12px;
}
.flight-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px;
}
.flight-zone-name {
  font-size: 12px;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 4px;
  text-align: center;
}
.flight-count {
  font-size: 28px;
  font-weight: 700;
  color: var(--text);
  text-align: center;
}
.flight-label { font-size: 11px; color: var(--text-dim); text-align: center; margin-bottom: 8px; }
.flight-note { font-size: 11px; color: var(--text-dim); margin-bottom: 8px; text-align: center; }

/* --- Footer --- */
footer {
  margin-top: 32px;
  padding-top: 16px;
  border-top: 1px solid var(--border);
  font-size: 11px;
  color: var(--text-dim);
  text-align: center;
  line-height: 1.7;
}
footer a { color: var(--blue); text-decoration: none; }

.loading {
  text-align: center;
  padding: 60px;
  color: var(--text-dim);
  font-size: 14px;
}
</style>
</head>
<body>
<div class="container">
  <header>
    <div>
      <div class="logo">SENTINEL<span>Infrastructure Ground Truth</span></div>
    </div>
    <div class="meta">
      <div><span class="refresh-dot"></span>Auto-refresh 60s</div>
      <div class="updated" id="lastUpdated">Loading...</div>
    </div>
  </header>

  <div class="banner red" id="errorBanner"></div>
  <div class="banner amber" id="staleBanner"></div>

  <div id="content">
    <div class="loading" id="loadingMsg">Connecting to Sentinel API...</div>
  </div>
</div>

<script>
const API_URL = 'https://dy5td5v3n7.execute-api.us-east-1.amazonaws.com/api/status';
const STALE_AFTER_S = 15 * 60;

// BGP visibility thresholds (fraction of RIPE RIS peers seeing the ASN's routes)
const BGP_WARN_BELOW = 0.90;
const BGP_DOWN_BELOW = 0.50;
// Prefix count vs 24h median: a large withdrawal is a routing event even if visibility holds
const PREFIX_WARN_RATIO = 0.80;
const PREFIX_DOWN_RATIO = 0.50;
// Share of ADS-B positions with degraded GPS integrity
const GPS_WARN_SHARE = 0.10;
const GPS_DOWN_SHARE = 0.25;

const REGIONS = {
  'UAE':       { label: 'United Arab Emirates', tag: 'me-central-1', aws: 'me-central-1', probeCC: 'AE', bgpCountry: 'AE' },
  'Israel':    { label: 'Israel', tag: 'il-central-1', aws: 'il-central-1', probeCC: 'IL', bgpCountry: 'IL' },
  'Hong Kong': { label: 'Hong Kong', tag: 'ap-east-1', aws: 'ap-east-1', probeCC: 'HK', bgpCountry: 'HK' },
  'Bahrain':   { label: 'Bahrain', tag: 'me-south-1 — TCP canary', canary: 'me-south-1', probeCC: 'BH', bgpCountry: 'BH' },
  'Taiwan':    { label: 'Taiwan', tag: 'BGP + probes only', probeCC: 'TW', bgpCountry: 'TW' },
};

const FLIGHT_ZONE_LABELS = {
  israel: 'Israel Airspace',
  persian_gulf: 'Persian Gulf',
  taiwan_strait: 'Taiwan Strait',
  hong_kong: 'Hong Kong FIR',
};

const STATUS_LABEL = { ok: 'Healthy', warn: 'Degraded', down: 'Down', err: 'No data', none: 'Not sampled' };

let lastData = null;

// ---------------------------------------------------------------- helpers

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function fmtUTC(ts, withSeconds) {
  if (!ts) return '—';
  const opts = { hour12: false, hour: '2-digit', minute: '2-digit', timeZone: 'UTC' };
  if (withSeconds) opts.second = '2-digit';
  return new Date(ts).toLocaleTimeString('en-GB', opts) + ' UTC';
}

// Worst of the real signals. Collector errors ('err') never make a region red on their own.
function worstStatus(...statuses) {
  const valid = statuses.filter(s => s);
  if (valid.includes('down')) return 'down';
  if (valid.includes('warn')) return 'warn';
  if (valid.includes('ok')) return 'ok';
  if (valid.includes('err')) return 'err';
  return 'none';
}

function visibilityStatus(vis) {
  if (vis == null) return 'err';
  if (vis < BGP_DOWN_BELOW) return 'down';
  if (vis < BGP_WARN_BELOW) return 'warn';
  return 'ok';
}

function prefixStatus(prefixes, baseline) {
  if (prefixes == null || !baseline) return 'ok';
  const ratio = prefixes / baseline;
  if (ratio < PREFIX_DOWN_RATIO) return 'down';
  if (ratio < PREFIX_WARN_RATIO) return 'warn';
  return 'ok';
}

function asnStatus(r, baseline) {
  if (r.status !== 'ok') return 'err';
  return worstStatus(visibilityStatus(r.v4_visibility), prefixStatus(r.announced_prefixes, baseline?.prefixes));
}

// Status for a group of ASNs: ignore collector errors if at least one answered.
function bgpGroupStatus(entries, baselines) {
  if (!entries.length) return 'none';
  const ok = entries.filter(e => e.status === 'ok');
  if (!ok.length) return 'err';
  return worstStatus(...ok.map(e => asnStatus(e, baselines?.[e.asn])));
}

function getHeartbeat(data, region) {
  if (!region) return null;
  return (data?.heartbeats?.results || []).find(h => h.region === region) || null;
}
function getCanary(data, region) {
  if (!region) return null;
  return (data?.canaries?.results || []).find(c => c.region === region) || null;
}
function getProbe(data, cc) {
  return (data?.probes?.results || []).find(p => p.country === cc) || null;
}
function getBgp(data, cc) {
  return (data?.bgp?.results || []).filter(b => b.country === cc);
}

function signalRow(label, value, status) {
  return `<div class="signal-row"><span class="signal-label">${esc(label)}</span><span class="signal-value ${status}">${esc(value)}</span></div>`;
}

// ------------------------------------------------------------ region cards

function renderRegionCards(current, baselines) {
  let html = '';
  for (const [name, cfg] of Object.entries(REGIONS)) {
    const hb = getHeartbeat(current, cfg.aws);
    const canary = getCanary(current, cfg.canary);
    const probe = getProbe(current, cfg.probeCC);
    const bgpEntries = getBgp(current, cfg.bgpCountry);

    const awsStatus = cfg.aws ? (hb ? (hb.reachable ? 'ok' : 'down') : 'err') : null;
    const canaryStatus = cfg.canary ? (canary ? (canary.reachable ? 'ok' : 'down') : 'err') : null;
    const probeStatus = probe ? (probe.status === 'ok' ? (probe.connected > 0 ? 'ok' : 'down') : 'err') : null;
    const bgpSt = bgpGroupStatus(bgpEntries, baselines);
    const overall = worstStatus(awsStatus, canaryStatus, probeStatus, bgpSt);

    html += `<div class="region-card ${overall}">`;
    html += `<div class="region-name">${esc(name)}`;
    if (cfg.canary) {
      html += `<span class="pill ${canaryStatus}">${canaryStatus === 'ok' ? 'CANARY — REACHABLE' : canaryStatus === 'down' ? 'CANARY — OFFLINE' : 'CANARY — NO DATA'}</span>`;
    }
    html += `</div>`;
    html += `<div class="region-tag">${esc(cfg.tag)}</div>`;

    if (cfg.aws) {
      const v = awsStatus === 'ok' ? `HEALTHY ${hb.latency_ms != null ? hb.latency_ms + ' ms' : ''}`.trim() : awsStatus === 'down' ? 'DOWN' : 'NO DATA';
      html += signalRow('AWS Heartbeat', v, awsStatus);
    }
    if (cfg.canary) {
      const v = canaryStatus === 'ok' ? `TCP OK ${canary.latency_ms} ms` : canaryStatus === 'down' ? 'UNREACHABLE' : 'NO DATA';
      html += signalRow(`TCP ${esc(canary?.host || 'canary')}`, v, canaryStatus);
    }
    if (probe) {
      const total = (probe.connected || 0) + (probe.disconnected || 0);
      html += signalRow('RIPE Probes', probe.status === 'ok' ? `${probe.connected}/${total} up` : 'NO DATA', probeStatus);
    }
    if (bgpEntries.length) {
      const ok = bgpEntries.filter(e => e.status === 'ok');
      const minVis = ok.length ? Math.min(...ok.map(e => e.v4_visibility ?? 1)) : null;
      const v = ok.length ? `${(minVis * 100).toFixed(1)}% vis · ${ok.length}/${bgpEntries.length} ASNs` : 'NO DATA';
      html += signalRow('BGP Routing', v, bgpSt);
    }

    html += '</div>';
  }
  return html;
}

// ---------------------------------------------------------------- timeline

const TIMELINE_ROWS = [
  { label: 'AWS Heartbeats', key: e => {
      const h = e.heartbeats; if (!h || !h.total) return 'none';
      return h.healthy === h.total ? 'ok' : h.healthy > 0 ? 'warn' : 'down'; } },
  { label: 'BGP Routing', key: e => {
      if (!e.bgp || !e.bgp.total) return 'none';
      if (!e.bgp.ok) return 'err';
      return visibilityStatus(e.bgp_min_visibility); } },
  { label: 'RIPE Probes', key: e => {
      const p = e.probes; if (!p || !p.total) return 'none';
      return p.ok === p.total ? 'ok' : p.ok > 0 ? 'warn' : 'err'; } },
  { label: 'ADS-B Flights', key: e => {
      const f = e.flights; if (!f || !f.total) return 'none';
      return f.ok === f.total ? 'ok' : f.ok > 0 ? 'warn' : 'err'; } },
  { label: 'Bahrain Canary', key: e => {
      const c = e.canaries?.['me-south-1'];
      return c === undefined ? 'none' : c ? 'ok' : 'down'; } },
];

function renderTimeline(timeline) {
  if (!timeline || !timeline.length) {
    return '<div class="timeline-container"><p style="color:var(--text-dim);text-align:center;padding:12px;">No timeline data</p></div>';
  }
  let html = '<div class="timeline-container">';
  for (const row of TIMELINE_ROWS) {
    html += `<div class="timeline-row"><div class="timeline-label">${esc(row.label)}</div><div class="timeline-bar">`;
    for (const entry of timeline) {
      const st = row.key(entry);
      html += `<div class="timeline-cell ${st}" title="${esc(fmtUTC(entry.timestamp))} — ${STATUS_LABEL[st]}"></div>`;
    }
    html += '</div></div>';
  }
  const first = new Date(timeline[0].timestamp);
  const last = new Date(timeline[timeline.length - 1].timestamp);
  const mid = new Date((first.getTime() + last.getTime()) / 2);
  html += `<div class="timeline-axis"><span>${fmtUTC(first)}</span><span>${fmtUTC(mid)}</span><span>${fmtUTC(last)}</span></div>`;
  html += '<div class="legend">';
  for (const st of ['ok', 'warn', 'down', 'err', 'none']) {
    html += `<span><i class="${st}"></i>${STATUS_LABEL[st]}${st === 'err' ? ' (collector error)' : ''}</span>`;
  }
  html += '</div></div>';
  return html;
}

// --------------------------------------------------------------- BGP table

function renderBgpTable(current, baselines) {
  const results = current?.bgp?.results || [];
  if (!results.length) return '';

  let html = '<div class="table-wrap"><table><thead><tr>';
  html += '<th>Country</th><th>ASN</th><th>Name</th><th>IPv4 Visibility</th><th>Peers</th><th>Prefixes (vs 24h)</th><th>Status</th>';
  html += '</tr></thead><tbody>';

  for (const r of results) {
    const base = baselines?.[r.asn];
    const st = asnStatus(r, base);
    const vis = r.v4_visibility != null ? (r.v4_visibility * 100).toFixed(1) + '%' : '—';
    const barWidth = r.v4_visibility != null ? Math.max(4, r.v4_visibility * 80) : 0;
    const barColor = { ok: 'var(--green)', warn: 'var(--amber)', down: 'var(--red)', err: 'var(--purple)' }[st];
    const peers = r.v4_peers_seeing != null ? `${r.v4_peers_seeing}/${r.v4_total_peers}` : '—';

    let prefixes = r.announced_prefixes != null ? String(r.announced_prefixes) : '—';
    if (r.announced_prefixes != null && base?.prefixes) {
      const d = r.announced_prefixes - base.prefixes;
      const pst = prefixStatus(r.announced_prefixes, base.prefixes);
      prefixes += `<span class="delta ${pst}">${d === 0 ? '±0' : (d > 0 ? '+' : '') + d}</span>`;
    }
    const label = { ok: 'OK', warn: 'DEGRADED', down: 'DOWN', err: 'NO DATA' }[st];

    html += '<tr>';
    html += `<td>${esc(r.country)}</td>`;
    html += `<td style="color:var(--blue)">${esc(r.asn)}</td>`;
    html += `<td>${esc(r.name)}</td>`;
    html += `<td><span class="vis-bar" style="width:${barWidth}px;background:${barColor}"></span>${vis}</td>`;
    html += `<td>${peers}</td>`;
    html += `<td>${prefixes}</td>`;
    html += `<td><span class="signal-value ${st}">${label}</span></td>`;
    html += '</tr>';
  }
  html += '</tbody></table></div>';
  return html;
}

// ----------------------------------------------------------------- flights

function renderFlights(current) {
  const results = current?.flights?.results;
  if (!results || !results.length) {
    return '<div class="flight-grid"><div class="flight-card"><div class="flight-zone-name">Flight Data</div><div class="flight-label">No flight data available</div></div></div>';
  }

  let html = '';
  if (current.flights_as_of) {
    const mins = Math.round((new Date() - new Date(current.flights_as_of)) / 60000);
    html += `<div class="flight-note">Latest sample failed — showing data from ${mins} min ago (${esc(fmtUTC(current.flights_as_of))})</div>`;
  }

  html += '<div class="flight-grid">';
  for (const r of results) {
    const label = FLIGHT_ZONE_LABELS[r.zone] || r.zone;
    html += `<div class="flight-card"><div class="flight-zone-name">${esc(label)}</div>`;
    if (r.status !== 'ok') {
      html += `<div class="flight-count" style="font-size:16px;color:var(--purple)">NO DATA</div>`;
      html += `<div class="flight-label">${esc((r.error || 'collector error').slice(0, 60))}</div></div>`;
      continue;
    }
    html += `<div class="flight-count">${r.aircraft_count}</div>`;
    html += `<div class="flight-label">aircraft tracked</div>`;

    const mil = r.military_count || 0;
    html += signalRow('Military', String(mil), mil > 0 ? 'warn' : 'na');

    const sampled = r.gps_sampled || 0;
    const degraded = r.gps_degraded_count || 0;
    if (sampled > 0) {
      const share = degraded / sampled;
      const st = share >= GPS_DOWN_SHARE ? 'down' : share >= GPS_WARN_SHARE ? 'warn' : 'na';
      html += signalRow('GPS degraded', `${degraded}/${sampled} (${(share * 100).toFixed(0)}%)`, st);
    } else {
      html += signalRow('GPS degraded', '—', 'na');
    }
    html += '</div>';
  }
  html += '</div>';
  return html;
}

// ------------------------------------------------------------------ render

function render(data) {
  const current = data.current;
  const timeline = data.timeline || [];
  const baselines = data.bgp_baseline || {};

  if (!current) {
    document.getElementById('content').innerHTML = '<div class="loading">No data available yet</div>';
    return;
  }

  document.getElementById('lastUpdated').textContent = 'Data: ' + fmtUTC(current.timestamp, true);

  const stale = document.getElementById('staleBanner');
  const ageS = data.data_age_s ?? Math.round((Date.now() - new Date(current.timestamp)) / 1000);
  if (ageS > STALE_AFTER_S) {
    stale.textContent = `Stale data: last sample is ${Math.round(ageS / 60)} min old. The logger may be stalled; signals below may not reflect the present.`;
    stale.style.display = 'block';
  } else {
    stale.style.display = 'none';
  }

  let html = '';
  html += '<div class="section-title">Monitored Regions</div>';
  html += '<div class="region-grid">' + renderRegionCards(current, baselines) + '</div>';

  html += '<div class="section-title">24-Hour Timeline</div>';
  html += renderTimeline(timeline);

  html += '<div class="section-title">BGP Routing Detail</div>';
  html += `<div class="section-sub">Degraded below ${BGP_WARN_BELOW * 100}% peer visibility or a ${Math.round((1 - PREFIX_WARN_RATIO) * 100)}% prefix withdrawal vs the 24h median; Down below ${BGP_DOWN_BELOW * 100}% / ${Math.round((1 - PREFIX_DOWN_RATIO) * 100)}%.</div>`;
  html += renderBgpTable(current, baselines);

  html += '<div class="section-title">Airspace Activity</div>';
  html += '<div class="section-sub">ADS-B positions via adsb.lol. GPS degraded = navigation integrity category ≤ 6, a signature of GNSS jamming or spoofing.</div>';
  html += renderFlights(current);

  html += `<footer>
    Sources: AWS Lambda heartbeats · <a href="https://stat.ripe.net">RIPEstat</a> ·
    <a href="https://atlas.ripe.net">RIPE Atlas</a> · <a href="https://adsb.lol">adsb.lol</a><br>
    Sampled every 5 minutes · page refreshes every 60 seconds · ${data.entries_count || 0} samples in window
    ${current.collect_seconds != null ? `· last collection ${current.collect_seconds}s` : ''}
  </footer>`;

  document.getElementById('content').innerHTML = html;
}

async function fetchData() {
  const banner = document.getElementById('errorBanner');
  try {
    const resp = await fetch(API_URL);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const data = await resp.json();
    lastData = data;
    banner.style.display = 'none';
    render(data);
  } catch (err) {
    console.error('Fetch error:', err);
    banner.textContent = `API error: ${err.message}. ${lastData ? 'Showing last known data.' : ''}`;
    banner.style.display = 'block';
    if (lastData) render(lastData);
  }
}

fetchData();
setInterval(fetchData, 60000);
</script>
</body>
</html>
